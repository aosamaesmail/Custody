<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Tahoma, sans-serif; background: #f3f4f6; color: #111827; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 4px 0 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: #374151; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
  button { width: 100%; padding: 13px; font-size: 16px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; margin-top: 16px; }
  button.secondary { background: #e5e7eb; color: #111827; margin-top: 0; width: auto; padding: 7px 12px; font-size: 13px; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 10px; font-size: 14px; }
  .err { color: #b91c1c; } .ok { color: #047857; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .bal { font-size: 14px; margin-bottom: 8px; }
  .bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: #10b981; }
  .item { border-top: 1px solid #e5e7eb; padding: 9px 0; font-size: 14px; }
  .item small { color: #6b7280; display: block; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; margin-right: 4px; }
  .hidden { display: none; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="card">
    <h1>Custody Expenses<br><small style="font-weight:normal;color:#6b7280">مصروفات العهدة</small></h1>
    <label>Name / الاسم</label>
    <input id="lname" autocomplete="username">
    <label>PIN / الرقم السري</label>
    <input id="lpin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">Login / دخول</button>
    <div id="loginMsg" class="msg err"></div>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="top">
      <h1 id="hello"></h1>
      <button class="secondary" onclick="doLogout()">Logout</button>
    </div>

    <div class="card">
      <div class="bal" id="balText"></div>
      <div class="bar"><div id="balBar" style="width:0%"></div></div>
    </div>

    <div class="card">
      <h2>New expense / مصروف جديد</h2>
      <div class="row">
        <div><label>Date / التاريخ</label><input id="fdate" type="date"></div>
        <div><label>Amount / المبلغ (EGP)</label><input id="famount" type="number" inputmode="decimal" min="0" step="0.01"></div>
      </div>
      <label>Category / النوع</label><select id="fcat"></select>
      <label>Project / المشروع</label><select id="fproj"></select>
      <label>Description / البيان</label><textarea id="fdesc" rows="2" maxlength="300"></textarea>
      <label>Receipt photo / صورة الإيصال</label>
      <input id="fimg" type="file" accept="image/*" capture="environment">
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px">
        <input id="fnoreceipt" type="checkbox" style="width:auto" onchange="toggleNoReceipt()"> No receipt available / لا يوجد إيصال
      </label>
      <div id="noReceiptBox" class="hidden">
        <label>Reason / السبب</label><input id="fwhy" maxlength="200">
      </div>
      <button id="submitBtn" onclick="doSubmit()">Submit / إرسال</button>
      <div id="submitMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>My latest expenses / آخر مصروفاتي</h2>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
  var token = null;
  var cfg = null;

  google.script.run.withSuccessHandler(function (c) {
    cfg = c;
    fill('fcat', c.categories, 'Select...');
    fill('fproj', c.projects, c.projects.length === 1 ? null : 'Select...');
  }).getConfig();

  function fill(id, list, placeholder) {
    var s = document.getElementById(id);
    s.innerHTML = '';
    if (placeholder) { var p = document.createElement('option'); p.value = ''; p.textContent = placeholder; s.appendChild(p); }
    list.forEach(function (x) { var o = document.createElement('option'); o.value = x; o.textContent = x; s.appendChild(o); });
  }
  function $(id) { return document.getElementById(id); }
  function setMsg(id, text, cls) { var e = $(id); e.textContent = text; e.className = 'msg ' + (cls || ''); }

  function doLogin() {
    $('loginBtn').disabled = true; setMsg('loginMsg', '');
    google.script.run.withSuccessHandler(function (r) {
      $('loginBtn').disabled = false;
      if (!r.ok) { setMsg('loginMsg', r.error, 'err'); return; }
      token = r.token; $('lpin').value = '';
      $('hello').textContent = 'Hello, ' + r.name;
      $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
      $('fdate').value = new Date().toISOString().slice(0, 10);
      refresh();
    }).withFailureHandler(function (e) {
      $('loginBtn').disabled = false; setMsg('loginMsg', 'Connection problem. Try again.', 'err');
    }).login($('lname').value, $('lpin').value);
  }

  function doLogout() {
    google.script.run.logout(token); token = null;
    $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
  }

  function expired() {
    token = null; $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
    setMsg('loginMsg', 'Session expired. Please log in again.', 'err');
  }

  function refresh() {
    google.script.run.withSuccessHandler(function (r) {
      if (r.expired) return expired();
      var pct = r.limit ? Math.min(100, Math.round(r.outstanding / r.limit * 100)) : 0;
      $('balText').textContent = 'Outstanding: ' + r.outstanding + ' of ' + r.limit + ' EGP  (الرصيد المستخدم)';
      $('balBar').style.width = pct + '%';
      $('balBar').style.background = pct >= 100 ? '#ef4444' : '#10b981';
      var list = $('list'); list.innerHTML = '';
      if (!r.items.length) list.textContent = 'No expenses yet.';
      r.items.forEach(function (it) {
        var d = document.createElement('div'); d.className = 'item';
        var t = document.createElement('div'); t.textContent = it.amount + ' EGP - ' + it.description; d.appendChild(t);
        var s = document.createElement('small'); s.textContent = it.date + ' | ' + it.category; d.appendChild(s);
        [['PM', it.pm], ['Finance', it.fin]].forEach(function (x) {
          var g = document.createElement('span'); g.className = 'tag'; g.textContent = x[0] + ': ' + x[1]; d.appendChild(g);
        });
        if (it.flag) { var f = document.createElement('small'); f.style.color = '#b45309'; f.textContent = it.flag; d.appendChild(f); }
        list.appendChild(d);
      });
    }).getMyExpenses(token);
  }

  function toggleNoReceipt() {
    var on = $('fnoreceipt').checked;
    $('noReceiptBox').classList.toggle('hidden', !on);
    if (on) $('fimg').value = '';
  }

  // Shrinks the photo to ~1400px JPEG so uploads are fast on mobile data.
  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1400 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
      };
      img.onerror = function () { reject(new Error('Could not read the photo')); };
      img.src = url;
    });
  }

  async function doSubmit() {
    setMsg('submitMsg', '');
    var payload = {
      date: $('fdate').value, amount: $('famount').value, category: $('fcat').value,
      project: $('fproj').value, description: $('fdesc').value,
      noReceiptReason: $('fnoreceipt').checked ? $('fwhy').value : '', image: ''
    };
    if (!payload.date || !payload.amount || !payload.category || !payload.project || !payload.description.trim()) {
      return setMsg('submitMsg', 'Please fill all fields.', 'err');
    }
    var file = $('fimg').files[0];
    if (!file && !$('fnoreceipt').checked) return setMsg('submitMsg', 'Take a receipt photo, or tick "No receipt".', 'err');
    $('submitBtn').disabled = true; setMsg('submitMsg', 'Uploading...');
    try { if (file) payload.image = await readImage(file); }
    catch (e) { $('submitBtn').disabled = false; return setMsg('submitMsg', e.message, 'err'); }

    google.script.run.withSuccessHandler(function (r) {
      $('submitBtn').disabled = false;
      if (r.expired) return expired();
      if (!r.ok) return setMsg('submitMsg', r.error, 'err');
      setMsg('submitMsg', 'Saved / تم الحفظ', 'ok');
      ['famount', 'fdesc', 'fimg', 'fwhy'].forEach(function (id) { $(id).value = ''; });
      $('fnoreceipt').checked = false; toggleNoReceipt();
      refresh();
    }).withFailureHandler(function () {
      $('submitBtn').disabled = false; setMsg('submitMsg', 'Connection problem. Not saved - try again.', 'err');
    }).submitExpense(token, payload);
  }
</script>
</body>
</html>
