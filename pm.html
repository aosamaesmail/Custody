<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM Expense Approval</title>
<style>
*{box-sizing:border-box}
:root{--navy:#111827;--blue:#1a73e8;--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--green:#047857;--red:#b91c1c;--amber:#b45309;--radius:12px}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;height:58px;padding:0 18px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:700;flex:1}.badge{font-size:12px;font-weight:700;background:#dbeafe;color:#1e40af;padding:5px 10px;border-radius:999px}
.wrap{max-width:1450px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:16px}
.login{max-width:420px;margin:8vh auto;padding:16px}
h1,h2,h3{margin:0 0 12px}h1{font-size:23px}h2{font-size:18px}h3{font-size:16px}
label{display:block;font-size:13px;font-weight:700;color:#374151;margin:10px 0 6px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:92px;resize:vertical}
button{border:0;border-radius:10px;min-height:42px;padding:9px 14px;cursor:pointer;font-weight:600}
.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb;color:#111827}.approve{background:#059669;color:#fff}.reject{background:#dc2626;color:#fff}.clarify{background:#d97706;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{font-size:13px;margin-top:9px}.err{color:var(--red)}.ok{color:var(--green)}.muted{color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:#fff;border:1px solid var(--border)}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.stat .n{font-size:28px;font-weight:800;margin-top:5px}.stat small{color:var(--muted)}
.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.filters label{margin-top:0}
.layout{display:grid;grid-template-columns:minmax(500px,1.1fr) minmax(440px,.9fr);gap:14px;margin-top:14px}
.table-wrap{overflow:auto;max-height:72vh}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{position:sticky;top:0;background:#f9fafb;z-index:2;text-align:left;color:#4b5563}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}.table tr.data-row{cursor:pointer}.table tr.data-row:hover,.table tr.selected{background:#eff6ff}
.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.s-pending{background:#f3f4f6}.s-approved{background:#d1fae5;color:#065f46}.s-rejected{background:#fee2e2;color:#991b1b}.s-clarification{background:#fef3c7;color:#92400e}
.review-empty{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.feed{max-width:860px;margin:14px auto 0;display:flex;flex-direction:column;gap:16px}
.feed-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.11);padding:16px}
.feed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid #e5e7eb;padding-bottom:12px;margin-bottom:12px}
.feed-head h2{margin:0 0 4px;font-size:18px}.feed-id{font-size:12px;color:var(--muted)}
.feed-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-bottom:10px}
.feed-meta .detail{padding:6px 0}.feed-desc{padding:10px 0;border-top:1px solid #f3f4f6}
.feed-receipt{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0}
.feed-receipt img{display:block;max-width:100%;max-height:650px;object-fit:contain;cursor:zoom-in}
.feed-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.feed-comment{margin-top:10px}
.feed-status{font-size:13px;margin-top:8px}
.load-more{display:block;margin:4px auto 18px;min-width:220px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:12px}.detail{padding:7px 0;border-bottom:1px solid #f3f4f6}.detail small{display:block;color:var(--muted);margin-bottom:2px}.detail b{word-break:break-word}
.receipt-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0}.receipt-box img{display:block;max-width:100%;max-height:520px;object-fit:contain;cursor:zoom-in}.receipt-placeholder{text-align:center;color:var(--muted);padding:30px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{min-height:38px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.check{display:flex;gap:8px;align-items:center;font-size:13px}.check input{width:18px;min-height:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.transfer-total{font-size:28px;font-weight:800}.transfer-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.transfer-actions>div{flex:1;min-width:220px}
.review-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.review-head h2{margin:0}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.table-wrap{max-height:480px}.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr 1fr}.filters .refresh{grid-column:span 3}}
@media(max-width:600px){.feed-meta{grid-template-columns:1fr 1fr}.feed-actions{grid-template-columns:1fr}.wrap{padding:10px}.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters .refresh{grid-column:span 2}.detail-grid,.row,.checks{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.topbar{padding:0 10px}.top-actions .reviewer{display:none}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="card">
    <h1>PM Expense Approval</h1>
    <div class="muted">Project Manager Approval / اعتماد مدير المشروع</div>
    <label>PM Reviewer Name / اسم المراجع</label>
    <input id="reviewer" autocomplete="name" placeholder="PM reviewer name">
    <label>PM PIN / الرقم السري</label>
    <input id="pmPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PM PIN">
    <button id="loginBtn" class="primary" style="width:100%;margin-top:14px" onclick="login()">Login / دخول</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
<header class="topbar">
  <div class="brand">PM Expense Approval</div>
  <div class="top-actions"><span class="reviewer" id="who"></span><span class="badge">PM</span><button class="secondary" onclick="logout()">Log out</button></div>
</header>
<main class="wrap">
  <div class="tabs">
    <button id="tabReview" class="active" onclick="showTab('reviewTab')">Receipt Review</button>
  </div>
  <section id="reviewTab">
  <div class="summary">
    <div class="stat"><small>Pending Review</small><div class="n" id="sPending">0</div></div>
    <div class="stat"><small>Approved</small><div class="n" id="sApproved">0</div></div>
    <div class="stat"><small>Rejected</small><div class="n" id="sRejected">0</div></div>
    <div class="stat"><small>Needs Clarification</small><div class="n" id="sClarify">0</div></div>
  </div>

  <div class="card">
    <div class="filters">
      <div><label>Engineer</label><select id="fEngineer" onchange="applyLocalFilters()"><option value="">All Engineers</option></select></div>
      <div><label>Status</label><select id="fStatus" onchange="loadQueue()"><option>Pending</option><option>Approved</option><option>Rejected</option><option>Needs Clarification</option><option>All</option></select></div>
      <div><label>Project</label><select id="fProject" onchange="applyLocalFilters()"><option value="">All Projects</option></select></div>
      <div><label>From</label><input id="fFrom" type="date" onchange="loadQueue()"></div>
      <div><label>To</label><input id="fTo" type="date" onchange="loadQueue()"></div>
      <div class="refresh"><button class="secondary" style="width:100%" onclick="loadQueue()">Refresh</button></div>
    </div>
  </div>

  <div id="feed" class="feed"></div>
  <button id="loadMoreBtn" class="secondary load-more hidden" onclick="renderMore()">Load more receipts</button>
  <div id="feedEmpty" class="card review-empty hidden">No expenses match these filters.</div>
  </section>
</main>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxE2_an7yy_3pfaG_rShM_gBc0QTLeTN7pvn6bJ-BWPFei2Wst4N9XKiVg0dQZNHZhA/exec';
const API = GAS_URL;
let pmToken=null, pmReviewerName='', allRows=[], shownRows=[], selected=null, readyRows=[], renderedCount=0;
const FEED_BATCH=15;

function $(id){return document.getElementById(id)}
function msg(id,t,c){const e=$(id);if(!e)return;e.textContent=t||'';e.className='msg '+(c||'')}
async function api(action,data){
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:data||{}}),redirect:'follow'});
  const text=await res.text();
  try{return JSON.parse(text)}catch(e){throw new Error('Unexpected reply from Apps Script (HTTP '+res.status+').')}
}
function saveSession(){sessionStorage.setItem('custody.pm',JSON.stringify({token:pmToken,reviewer:pmReviewerName}))}
function clearSession(){sessionStorage.removeItem('custody.pm')}
function getSession(){try{return JSON.parse(sessionStorage.getItem('custody.pm')||'null')}catch(e){return null}}

async function login(){
  const reviewer=$('reviewer').value.trim(),pin=$('pmPin').value.trim();
  if(!reviewer)return msg('loginMsg','Enter the reviewer name.','err');
  if(!pin)return msg('loginMsg','Enter the PM PIN.','err');
  $('loginBtn').disabled=true;msg('loginMsg','Logging in...');
  try{
    const r=await api('pmLogin',{pin,reviewer});
    if(!r.ok)return msg('loginMsg',r.error,'err');
    pmToken=r.token;pmReviewerName=r.reviewer||reviewer;saveSession();showApp();await loadQueue();
  }catch(e){msg('loginMsg','Connection problem: '+e.message,'err')}
  finally{$('loginBtn').disabled=false}
}
function showApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=pmReviewerName}
function logout(){pmToken=null;pmReviewerName='';clearSession();$('app').classList.add('hidden');$('loginView').classList.remove('hidden');$('pmPin').value='';msg('loginMsg','')}
function expired(){logout();msg('loginMsg','Finance session expired. Please log in again.','err')}

function statusClass(s){if(s==='Approved')return's-approved';if(s==='Rejected')return's-rejected';if(s==='Needs Clarification')return's-clarification';return's-pending'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadQueue(){
  if(!pmToken)return;
  try{
    const r=await api('getPMExpenses',{pmToken,filters:{status:$('fStatus').value,from:$('fFrom').value,to:$('fTo').value}});
    if(r.expired)return expired();
    if(!r.ok)throw new Error(r.error);
    allRows=r.rows||[];
    const s=r.summary||{};
    $('sPending').textContent=s.pending||0;$('sApproved').textContent=s.approved||0;$('sRejected').textContent=s.rejected||0;$('sClarify').textContent=s.clarification||0;
    refillFilters();applyLocalFilters();
  }catch(e){$('feed').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}
}
function refillFilters(){
  const oldE=$('fEngineer').value,oldP=$('fProject').value;
  const engineers=[...new Set(allRows.map(x=>x.engineer).filter(Boolean))].sort();
  const projects=[...new Set(allRows.map(x=>x.project).filter(Boolean))].sort();
  $('fEngineer').innerHTML='<option value="">All Engineers</option>'+engineers.map(x=>'<option>'+esc(x)+'</option>').join('');
  $('fProject').innerHTML='<option value="">All Projects</option>'+projects.map(x=>'<option>'+esc(x)+'</option>').join('');
  if(engineers.includes(oldE))$('fEngineer').value=oldE;if(projects.includes(oldP))$('fProject').value=oldP;
}
function applyLocalFilters(){
  const e=$('fEngineer').value,p=$('fProject').value;
  shownRows=allRows.filter(x=>(!e||x.engineer===e)&&(!p||x.project===p));
  renderedCount=0;$('feed').innerHTML='';
  $('feedEmpty').classList.toggle('hidden',shownRows.length!==0);
  renderMore();
}
function renderMore(){
  const feed=$('feed');
  const next=shownRows.slice(renderedCount,renderedCount+FEED_BATCH);
  next.forEach(x=>feed.appendChild(buildFeedCard(x)));
  renderedCount+=next.length;
  $('loadMoreBtn').classList.toggle('hidden',renderedCount>=shownRows.length);
}
function buildFeedCard(x){
  const card=document.createElement('article');card.className='feed-card';card.dataset.id=x.id;
  const receiptId='receipt-'+safeId(x.id),commentId='comment-'+safeId(x.id),msgId='msg-'+safeId(x.id);
  card.innerHTML=
    '<div class="feed-head"><div><h2>'+esc(x.engineer)+'</h2><div class="feed-id">Expense '+esc(x.id)+'</div></div>'+
    '<span class="status '+statusClass(x.pmStatus)+'">'+esc(x.pmStatus)+'</span></div>'+
    '<div class="feed-meta">'+
      meta('Expense Date',x.date)+meta('Amount',Number(x.amount||0).toFixed(2)+' EGP')+meta('Category',x.category)+
      meta('Project',x.project)+meta('Finance Status',x.financeStatus)+meta('Submitted',x.submitted||'')+
    '</div>'+
    '<div class="feed-desc"><small class="muted">Description</small><div><b>'+esc(x.description)+'</b></div></div>'+
    (x.flag?'<div class="feed-desc"><small class="muted">Flag</small><div style="color:#b45309"><b>'+esc(x.flag)+'</b></div></div>':'')+
    '<div id="'+receiptId+'" class="feed-receipt"><div class="receipt-placeholder">'+(x.hasReceipt?'Loading receipt...':'No receipt attached to this expense.')+'</div></div>'+
    (x.hasReceipt?'<button class="secondary" onclick="openOriginalFor(\''+jsq(x.id)+'\')">Open Original Receipt</button>':'')+
    '<div class="feed-comment"><label>PM Comment</label><textarea id="'+commentId+'" maxlength="500" placeholder="Required for Reject or Needs Clarification">'+esc(x.financeComment||'')+'</textarea></div>'+
    '<div class="feed-actions">'+
      '<button class="approve" onclick="feedDecision(\''+jsq(x.id)+'\',\'Approved\')">Approve</button>'+
      '<button class="clarify" onclick="feedDecision(\''+jsq(x.id)+'\',\'Needs Clarification\')">Need Clarification</button>'+
      '<button class="reject" onclick="feedDecision(\''+jsq(x.id)+'\',\'Rejected\')">Reject</button>'+
    '</div><div id="'+msgId+'" class="feed-status"></div>';
  if(x.hasReceipt)loadFeedReceipt(x.id,receiptId);
  return card;
}
function meta(label,value){return '<div class="detail"><small>'+esc(label)+'</small><b>'+esc(value||'')+'</b></div>'}
function safeId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function loadFeedReceipt(id,boxId){
  try{
    const r=await api('getPMReceiptImage',{pmToken,id});
    if(r.expired)return expired();
    const box=$(boxId);if(!box)return;
    if(!r.ok){box.innerHTML='<div class="receipt-placeholder">'+esc(r.error)+'</div>';return}
    const img=document.createElement('img');img.src=r.dataUrl;img.alt='Receipt '+id;img.loading='lazy';
    img.onclick=()=>window.open(r.dataUrl,'_blank');box.innerHTML='';box.appendChild(img);
  }catch(e){const box=$(boxId);if(box)box.innerHTML='<div class="receipt-placeholder">'+esc(e.message)+'</div>'}
}
function openOriginalFor(id){
  const x=allRows.find(r=>r.id===id);if(x&&x.receiptUrl)window.open(x.receiptUrl,'_blank');
}
async function feedDecision(id,decision){
  const x=allRows.find(r=>r.id===id);if(!x)return;
  const comment=$('comment-'+safeId(id)).value.trim(),status=$('msg-'+safeId(id));
  if((decision==='Rejected'||decision==='Needs Clarification')&&!comment){status.textContent='Enter a Finance comment explaining the issue.';status.className='feed-status err';return}
  const card=document.querySelector('.feed-card[data-id="'+CSS.escape(id)+'"]');
  const buttons=card?card.querySelectorAll('button'):[];
  buttons.forEach(b=>b.disabled=true);status.textContent='Saving review...';status.className='feed-status';
  try{
    const r=await api('reviewPMExpense',{pmToken,id,decision,comment});
    if(r.expired)return expired();if(!r.ok)throw new Error(r.error);
    // Remove immediately from the current Pending feed after any completed review.
    if($('fStatus').value==='Pending'){
      allRows=allRows.filter(v=>v.id!==id);shownRows=shownRows.filter(v=>v.id!==id);
      if(card){card.style.transition='opacity .18s ease,transform .18s ease';card.style.opacity='0';card.style.transform='translateY(-8px)';setTimeout(()=>card.remove(),190)}
      updateSummaryAfterDecision(decision);
      $('feedEmpty').classList.toggle('hidden',shownRows.length!==0);
    }else{
      status.textContent='Review saved.';status.className='feed-status ok';await loadQueue();
    }
  }catch(e){status.textContent=e.message;status.className='feed-status err';buttons.forEach(b=>b.disabled=false)}
}
function updateSummaryAfterDecision(decision){
  const p=Math.max(0,Number($('sPending').textContent||0)-1);$('sPending').textContent=p;
  if(decision==='Approved')$('sApproved').textContent=Number($('sApproved').textContent||0)+1;
  if(decision==='Rejected')$('sRejected').textContent=Number($('sRejected').textContent||0)+1;
  if(decision==='Needs Clarification')$('sClarify').textContent=Number($('sClarify').textContent||0)+1;
}

$('pmPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
const saved=getSession();if(saved&&saved.token){pmToken=saved.token;pmReviewerName=saved.reviewer||'FINANCE';showApp();loadQueue()}
</script>
</body>
</html>
